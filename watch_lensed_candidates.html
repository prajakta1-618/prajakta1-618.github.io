<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lensed Transient Candidates</title>
<style>
  :root {
    --accent: #51247a;
    --accent-light: #e8dff0;
    --bg: #f9f8fc;
    --surface: #ffffff;
    --border: #e0d8ea;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --radius: 10px;
    --gap: 20px;
    --both-bg: #e8dff0;   --both-fg: #51247a;
    --ext-bg:  #faeeda;   --ext-fg:  #854f0b;
    --cma-bg:  #e1f5ee;   --cma-fg:  #0f6e56;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--accent);
    color: #fff;
    padding: 1.5rem 2rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.01em; }
  header .path { font-size: 0.85rem; opacity: 0.75; font-family: monospace; }

  #tabbar {
    display: flex;
    gap: 8px;
    padding: 12px 2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .tab {
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    white-space: nowrap;
  }
  .tab:hover { background: var(--accent-light); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .tab .cnt { opacity: 0.7; margin-left: 4px; }
  .tab.active .cnt { opacity: 0.85; }

main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

  .empty-state { text-align: center; padding: 5rem 2rem; color: var(--muted); }
  .empty-state p { font-size: 0.95rem; margin-top: 0.5rem; }
  .empty-state code {
    font-family: monospace; background: var(--accent-light); color: var(--accent);
    padding: 2px 6px; border-radius: 4px; font-size: 0.85rem;
  }

  .candidate-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 2rem;
    overflow: hidden;
  }

  .candidate-header {
    background: var(--accent-light);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .candidate-header .obj-id {
    font-size: 0.95rem; font-weight: 600; color: var(--accent);
    font-family: monospace; letter-spacing: 0.02em;
  }
  .badge {
    font-size: 0.72rem; font-weight: 600; padding: 2px 10px; border-radius: 20px;
    letter-spacing: 0.02em;
  }
  .badge.both { background: var(--both-bg); color: var(--both-fg); }
  .badge.ext  { background: var(--ext-bg);  color: var(--ext-fg); }
  .badge.cma  { background: var(--cma-bg);  color: var(--cma-fg); }
  .candidate-header .sherlock { font-size: 0.78rem; color: var(--muted); margin-left: auto; }

  .body-pad { padding: var(--gap); }

  .top-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    margin-bottom: var(--gap);
  }
  .top-row.single { grid-template-columns: 1fr; }

  .panel { display: flex; flex-direction: column; gap: 8px; }
  .panel .label {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
  }

  .cutouts { display: flex; flex-direction: column; gap: 16px; }
  .cutout-item { display: flex; flex-direction: column; gap: 6px; }
  .cutout-item .caption { font-size: 0.75rem; color: var(--muted); font-family: monospace; }
  .cutout-item .caption .tag { color: var(--accent); font-weight: 600; margin-right: 6px; }

  img.plot {
    width: 100%; max-width: 700px; height: auto;
    margin-left: auto; margin-right: auto;
    border-radius: 6px; border: 1px solid var(--border);
    display: block; cursor: zoom-in; transition: box-shadow 0.15s ease; background: #f0ecf5;
  }
  img.plot:hover { box-shadow: 0 0 0 2px var(--accent); }

  .missing-img {
    width: 100%; aspect-ratio: 3/1; border-radius: 6px; border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.8rem; background: #fafafa;
  }

  @media (max-width: 680px) {
    .top-row, .top-row.single { grid-template-columns: 1fr; }
    main { padding: 1rem; }
    header, #tabbar { padding-left: 1rem; padding-right: 1rem; }
  }

  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(20,10,35,0.92);
    z-index: 1000; align-items: center; justify-content: center; padding: 2rem; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 90vh; width: auto; height: auto; border-radius: 8px;
    display: block; cursor: default; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  #lightbox-close {
    position: fixed; top: 1.2rem; right: 1.5rem; color: rgba(255,255,255,0.8);
    font-size: 2rem; cursor: pointer; line-height: 1; background: none; border: none; padding: 0;
  }
  #lightbox-caption {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 0.8rem; font-family: monospace; white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Lensed Transient Candidates</h1>
  <span class="path">candidate_cutouts_lcs/</span>
</header>

<nav id="tabbar"></nav>

<main id="gallery">
  <div class="empty-state" id="empty-msg">
    <strong>No candidates loaded</strong>
    <p>This page reads <code>candidate_cutouts_lcs/manifest.json</code>.</p>
  </div>
</main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded image">
  <button id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="" />
  <div id="lightbox-caption"></div>
</div>

<script>
const FOLDER = "candidate_cutouts_lcs";

const GROUPS = [
  { key: "both", label: "Both" },
  { key: "ext",  label: "Extendedness only" },
  { key: "cma",  label: "Color-mag only" },
];

let manifest = [];
let activeGroup = "both";

function imgSrc(file) { return FOLDER + "/" + file; }

function makeImg(file, altText, captionForLightbox) {
  const img = new Image();
  img.className = "plot";
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = altText;
  img.src = imgSrc(file);
  img.addEventListener("click", () => openLightbox(img.src, captionForLightbox));
  img.addEventListener("error", () => {
    const ph = document.createElement("div");
    ph.className = "missing-img";
    ph.textContent = "not found: " + file;
    img.replaceWith(ph);
  });
  return img;
}

function makeCard(obj) {
  const block = document.createElement("div");
  block.className = "candidate-block";
  block.dataset.group = obj.group;

  const hdr = document.createElement("div");
  hdr.className = "candidate-header";
  hdr.innerHTML =
    `<span class="obj-id">${obj.id}</span>` +
    `<span class="badge ${obj.group}">${obj.group}</span>` +
    (obj.sherlock ? `<span class="sherlock">Sherlock: ${obj.sherlock}</span>` : "");
  block.appendChild(hdr);

  const pad = document.createElement("div");
  pad.className = "body-pad";

  const top = document.createElement("div");
  top.className = "top-row" + (obj.has_cmd ? "" : " single");

  const lcPanel = document.createElement("div");
  lcPanel.className = "panel";
  lcPanel.innerHTML = `<div class="label">Light curve</div>`;
  lcPanel.appendChild(makeImg(`${obj.id}_lc.png`, "Light curve of " + obj.id, obj.id + "  \u00b7  light curve"));
  top.appendChild(lcPanel);

  if (obj.has_cmd) {
    const cmdPanel = document.createElement("div");
    cmdPanel.className = "panel";
    cmdPanel.innerHTML = `<div class="label">Color-magnitude</div>`;
    cmdPanel.appendChild(makeImg(`${obj.id}_cmd.png`, "Color-magnitude diagram of " + obj.id, obj.id + "  \u00b7  CMD"));
    top.appendChild(cmdPanel);
  }
  pad.appendChild(top);

  if (obj.cutouts && obj.cutouts.length) {
    const wrap = document.createElement("div");
    wrap.className = "cutouts";
    obj.cutouts.forEach(c => {
      const item = document.createElement("div");
      item.className = "cutout-item";
      const tag = (c.label || "").replace(/\+/g, " + ");
      const mjd = (typeof c.mjd === "number") ? c.mjd.toFixed(5) : c.mjd;
      const cap = document.createElement("div");
      cap.className = "caption";
      cap.innerHTML = `<span class="tag">${tag}</span>MJD ${mjd}`;
      item.appendChild(cap);
      item.appendChild(makeImg(c.file, `${tag} cutout of ${obj.id}`, `${obj.id}  \u00b7  ${tag}  \u00b7  MJD ${mjd}`));
      wrap.appendChild(item);
    });
    pad.appendChild(wrap);
  }

  block.appendChild(pad);
  return block;
}

function renderTabs(counts) {
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  GROUPS.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "tab" + (g.key === activeGroup ? " active" : "");
    btn.innerHTML = `${g.label}<span class="cnt">${counts[g.key] || 0}</span>`;
    btn.addEventListener("click", () => setActive(g.key));
    bar.appendChild(btn);
  });
}

function setActive(key) {
  activeGroup = key;
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.classList.toggle("active", GROUPS[i].key === key);
  });
  document.querySelectorAll(".candidate-block").forEach(b => {
    b.style.display = (b.dataset.group === key) ? "" : "none";
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function init() {
  const gallery = document.getElementById("gallery");
  const emptyMsg = document.getElementById("empty-msg");

  try {
    const res = await fetch(FOLDER + "/manifest.json");
    if (!res.ok) throw new Error("no manifest");
    manifest = await res.json();
  } catch {
    document.getElementById("tabbar").style.display = "none";
    return;
  }

  if (!Array.isArray(manifest) || manifest.length === 0) {
    document.getElementById("tabbar").style.display = "none";
    return;
  }

  emptyMsg.remove();

  const counts = { both: 0, ext: 0, cma: 0 };
  manifest.forEach(o => { counts[o.group] = (counts[o.group] || 0) + 1; });
  renderTabs(counts);

  const frag = document.createDocumentFragment();
  manifest.forEach(o => frag.appendChild(makeCard(o)));
  gallery.appendChild(frag);

  setActive(activeGroup);
}

const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lightbox-img");
const lbCap = document.getElementById("lightbox-caption");

function openLightbox(src, caption) {
  lbImg.src = src;
  lbCap.textContent = caption;
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  lb.classList.remove("open");
  lbImg.src = "";
  document.body.style.overflow = "";
}
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
lbImg.addEventListener("click", e => e.stopPropagation());

init();
</script>
</body>
</html>
